<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>音乐播放器</title>
<style>
:root{color-scheme:light dark;--ink:#292929;--muted:#888;--bar:rgba(0,0,0,.04);--face:#242424;--paper:#f5f5f5;--line:#dedede}
@media(prefers-color-scheme:dark){:root{--ink:#f3f3f3;--muted:#aaa;--bar:rgba(255,255,255,.09);--face:#383838;--paper:#242424;--line:#494949}}
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid var(--muted);outline-offset:3px}button:disabled{cursor:default}button:active{opacity:.65}img{-webkit-user-drag:none}
#shell{position:absolute;width:100%;top:50%;transform:translateY(-50%)}#stage{position:absolute;width:1170px;height:204px;transform-origin:0 0;overflow:hidden}#bar{position:absolute;left:19px;top:45px;width:346px;height:115px;border-radius:57.5px;background:var(--bar);transition:width .52s cubic-bezier(.22,.7,.15,1)}
#avatarFrame{position:absolute;left:18px;top:45px;width:115.352px;height:115.352px;border:7px solid #fff;border-radius:50%;background:#e8e8e8;box-shadow:0 24px 57.5px rgba(0,0,0,.05)}#avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;animation:record 10s linear infinite;animation-play-state:paused}#stage.playing #avatar{animation-play-state:running}@keyframes record{to{transform:rotate(360deg)}}
#avatarHit{position:absolute;left:18px;top:45px;width:115.352px;height:115.352px;padding:0;background:transparent;border-radius:50%;z-index:2}
#heading{position:absolute;left:166px;top:62px;width:515px;height:38px;white-space:nowrap;overflow:hidden;display:flex;align-items:baseline;gap:9px;line-height:38px}#name{font-size:35px;font-weight:400;text-shadow:.66px 0 currentColor,-.66px 0 currentColor,0 .66px currentColor,0 -.66px currentColor;flex-shrink:0;max-width:515px;overflow:hidden;text-overflow:ellipsis}#artist{font-size:25px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
#captionHit{position:absolute;left:160px;top:102px;width:532px;height:43px;border-radius:8px;background:transparent;padding:3px 6px;text-align:left;overflow:hidden;cursor:text}#captionClip{display:block;width:100%;overflow:hidden}#caption{display:inline-block;font-size:31px;font-weight:600;line-height:37px;white-space:nowrap}#caption.enter{animation:arrive .3s ease-out}@keyframes arrive{from{opacity:.05;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
#captionClip.overflow{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent)}#stage:not(.playing) #caption{max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
#editor{position:absolute;left:160px;top:102px;height:44px;width:532px;background:transparent;border:0;outline:0;border-radius:8px;color:var(--ink);font-size:31px;font-weight:600;padding:3px 6px;line-height:37px}#editor:focus{box-shadow:inset 0 -2px var(--muted)}[hidden]{display:none!important}
.control{position:absolute;top:53px;width:100px;height:100px;padding:0;border-radius:50%;background:var(--bar)}.control svg{width:100%;height:100%;display:block;overflow:visible}.control svg .ink{stroke:var(--ink)}#searchButton{left:802px}#playButton{left:922px}#faceButton{left:1042px;background:var(--face)}#playGlyph{fill:var(--ink)}#pauseGlyph{display:none}#stage.playing #playGlyph{display:none}#stage.playing #pauseGlyph{display:block}
#faceFeatures{transform-origin:50px 50px;animation:faceFloat 3.7s ease-in-out infinite}#eyePair{transform-origin:50px 42px;animation:blink 5.1s infinite}#faceButton.changed svg{animation:facePop .3s ease-out}@keyframes faceFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}@keyframes blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.12)}}@keyframes facePop{0%{transform:scale(.9)}65%{transform:scale(1.045)}100%{transform:scale(1)}}
#particles{position:absolute;inset:0;width:1170px;height:204px;pointer-events:none}#audio{display:none}
#panel{position:absolute;inset:0;background:var(--paper);border-radius:18px;display:flex;flex-direction:column;justify-content:center;padding:4px 7px;gap:3px;z-index:5}#searchForm{height:29px;display:flex;gap:5px;align-items:center;flex-shrink:0}#searchForm button{background:var(--bar);border-radius:7px;height:28px;padding:0 8px;font-size:12px;white-space:nowrap}#closeSearch{font-size:20px!important;min-width:27px}#query{width:0;min-width:0;flex:1;height:28px;background:transparent;color:var(--ink);border:0;outline:0;font-size:16px;padding:0 4px}#results{display:flex;gap:6px;align-items:center;height:29px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}#results::-webkit-scrollbar{display:none}.result{min-width:130px;max-width:210px;height:29px;text-align:left;padding:0 8px;border-radius:7px;background:var(--bar);display:flex;align-items:center;gap:7px;flex-shrink:0}.resultName{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resultArtist{font-size:10px;color:var(--muted);white-space:nowrap}.status{font-size:12px;color:var(--muted);white-space:nowrap;margin:0 4px}#notice{position:absolute;left:5%;right:5%;top:50%;transform:translateY(-50%);z-index:8;padding:8px 12px;text-align:center;border-radius:12px;background:var(--paper);font-size:13px;box-shadow:0 2px 12px #0002;pointer-events:none}
.offscreen #avatar,.offscreen #faceFeatures,.offscreen #eyePair{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){#bar{transition:none}#avatar,#faceFeatures,#eyePair,#caption.enter,#faceButton.changed svg{animation:none!important}}
#colorPanel{position:absolute;inset:3px 5px;z-index:6;background:var(--paper);border-radius:14px;padding:4px 8px;display:flex;flex-direction:column;justify-content:center;gap:4px}#colorHeading{display:flex;align-items:center;justify-content:space-between;height:20px;font-size:12px;font-weight:600}#closeColors{background:transparent;padding:0 4px;height:22px;font-size:12px}#colorRow{display:flex;align-items:center;gap:8px;height:28px}#swatches{display:flex;align-items:center;gap:7px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none;padding:2px}#swatches::-webkit-scrollbar{display:none}.swatch{width:25px;height:25px;flex-shrink:0;border-radius:50%;border:2px solid transparent;background:var(--swatch);box-shadow:inset 0 0 0 1px #0001}.swatch[aria-pressed=true]{border-color:var(--paper);outline:2px solid var(--ink);outline-offset:0}#customColorLabel{display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;flex-shrink:0}#faceColorPicker{width:27px;height:27px;padding:0;border:1px solid var(--line);border-radius:7px;background:transparent;cursor:pointer}#faceColorPicker::-webkit-color-swatch-wrapper{padding:2px}#faceColorPicker::-webkit-color-swatch{border:0;border-radius:4px}#resetColors{height:27px;padding:0 7px;border-radius:7px;background:var(--bar);font-size:11px;flex-shrink:0}
</style>
</head>

<script>
'use strict';
(() => {

 if(state.song?.local){state.song.audioCandidates=[]}else if(state.song){state.song.audioCandidates=urls(state.song.audioCandidates||[])}
 render();
})();
